# Configuration de la base de données
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/caveodb?serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:caveo}
spring.datasource.password=${DB_PASSWORD:caveo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialisation SQL - utilise IGNORE pour éviter les doublons
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Encoding HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuration JWT
jwt.secret=azerty

# Port du serveur
server.port=8080